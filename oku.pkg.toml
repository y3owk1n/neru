# The manifest `oku add github:y3owk1n/neru` reads, see
# docs/guide/installation.md. Check a change with `oku manifest lint` and
# `oku manifest test`.
[package]
name = "neru"
description = "Keyboard-driven navigation for the mouse: hints, grids and scrolling"
homepage = "https://github.com/y3owk1n/neru"
license = "MIT"
# publish-artifacts.yml attests every release zip from v1.51.0 on.
signer_workflow = "y3owk1n/neru/.github/workflows/publish-artifacts.yml"
attestations = true

[version]
from = "github-releases"
repo = "y3owk1n/neru"
strip_prefix = "v"

# On macOS the command is the bundle's program, which oku runs from the copy of
# Neru.app in ~/Applications, so the CLI and the daemon share the app's
# Accessibility and Screen Recording permissions. The manifest leaves out the
# zip's bin/neru, since it would be a second program with the same name.
[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-darwin-arm64.zip"
sha256_url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-darwin-arm64.zip.sha256"
bin = ["Neru.app/Contents/MacOS/neru"]
app = ["Neru.app"]
man = ["share/man/man1/*.1"]
completions = { generate = "neru completion {{shell}}" }

[[artifact]]
match = { os = "darwin", arch = "amd64" }
url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-darwin-amd64.zip"
sha256_url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-darwin-amd64.zip.sha256"
bin = ["Neru.app/Contents/MacOS/neru"]
app = ["Neru.app"]
man = ["share/man/man1/*.1"]
completions = { generate = "neru completion {{shell}}" }

# The Linux binary links glibc and the system's display libraries, so a musl
# machine falls through to the build. Generating completions runs the binary,
# so the user installs the runtime libraries of docs/guide/linux.md first.
[[artifact]]
match = { os = "linux", arch = "arm64", libc = "glibc" }
url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-linux-arm64.zip"
sha256_url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-linux-arm64.zip.sha256"
bin = ["bin/neru"]
man = ["share/man/man1/*.1"]
completions = { generate = "neru completion {{shell}}" }

[[artifact]]
match = { os = "linux", arch = "amd64", libc = "glibc" }
url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-linux-amd64.zip"
sha256_url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-linux-amd64.zip.sha256"
bin = ["bin/neru"]
man = ["share/man/man1/*.1"]
completions = { generate = "neru completion {{shell}}" }

[[artifact]]
match = { os = "windows", arch = "arm64" }
url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-windows-arm64.zip"
sha256_url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-windows-arm64.zip.sha256"
bin = ["bin/neru.exe"]
man = ["share/man/man1/*.1"]
completions = { generate = "neru completion {{shell}}" }

[[artifact]]
match = { os = "windows", arch = "amd64" }
url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-windows-amd64.zip"
sha256_url = "https://github.com/y3owk1n/neru/releases/download/{{tag}}/neru-windows-amd64.zip.sha256"
bin = ["bin/neru.exe"]
man = ["share/man/man1/*.1"]
completions = { generate = "neru completion {{shell}}" }

# oku reports a missing entry on every add and sync, whether it installed the
# zip or a build. On Linux these are the build's -dev packages, which pull in
# the runtime libraries a zip needs too. macOS always gets a zip, so this list
# leaves out the Xcode tools.
[host]
cc = { command = "cc", apt = "build-essential", dnf = "gcc-c++", pacman = "base-devel", when = { os = "linux" } }
git = { command = "git", apt = "git", dnf = "git", pacman = "git", when = { os = "linux" } }
pkg-config = { command = "pkg-config", apt = "pkg-config", dnf = "pkgconf-pkg-config", pacman = "pkgconf", when = { os = "linux" } }
cairo = { apt = "libcairo2-dev", dnf = "cairo-devel", pacman = "cairo", when = { os = "linux" } }
wayland = { apt = "libwayland-dev", dnf = "wayland-devel", pacman = "wayland", when = { os = "linux" } }
libx11 = { apt = "libx11-dev", dnf = "libX11-devel", pacman = "libx11", when = { os = "linux" } }
libxtst = { apt = "libxtst-dev", dnf = "libXtst-devel", pacman = "libxtst", when = { os = "linux" } }
libxrandr = { apt = "libxrandr-dev", dnf = "libXrandr-devel", pacman = "libxrandr", when = { os = "linux" } }
libxrender = { apt = "libxrender-dev", dnf = "libXrender-devel", pacman = "libxrender", when = { os = "linux" } }
libxext = { apt = "libxext-dev", dnf = "libXext-devel", pacman = "libxext", when = { os = "linux" } }
libxfixes = { apt = "libxfixes-dev", dnf = "libXfixes-devel", pacman = "libxfixes", when = { os = "linux" } }
libxkbcommon = { apt = "libxkbcommon-dev", dnf = "libxkbcommon-devel", pacman = "libxkbcommon", when = { os = "linux" } }
libei = { apt = "libei-dev", dnf = "libei-devel", pacman = "libei", when = { os = "linux" } }
liboeffis = { apt = "liboeffis-dev", dnf = "liboeffis-devel", pacman = "libei", when = { os = "linux" } }
fontconfig = { apt = "libfontconfig-dev", dnf = "fontconfig-devel", pacman = "fontconfig", when = { os = "linux" } }
tesseract = { apt = "libtesseract-dev", dnf = "tesseract-devel", pacman = "tesseract", when = { os = "linux" } }
tesseract-eng = { apt = "tesseract-ocr-eng", dnf = "tesseract-langpack-eng", pacman = "tesseract-data-eng", when = { os = "linux" } }
pipewire = { apt = "libpipewire-0.3-dev", dnf = "pipewire-devel", pacman = "libpipewire", when = { os = "linux" } }
wayland-protocols = { apt = "wayland-protocols", dnf = "wayland-protocols-devel", pacman = "wayland-protocols", when = { os = "linux" } }
fonts-dejavu = { apt = "fonts-dejavu-core", dnf = "dejavu-sans-fonts", pacman = "ttf-dejavu", when = { os = "linux" } }

# The same build as the justfile's: cgo on for macOS and Linux, off for
# Windows, and the tag, commit and date in buildinfo. go comes from the repo's own
# manifest, read at the same commit. neru-main.toml repeats this build, so
# change both.
[build]
needs = ["git"]
deps = [{ ref = "./.oku/go.toml", version = "~1.26" }]
source = { git = "https://github.com/y3owk1n/neru", tag = "{{tag}}" }

[[build.step]]
vendor = "go"

# Fedora's libspa-0.2.pc, which pipewire pulls in, carries -fno-strict-overflow,
# which cgo rejects unless it is allowed. The justfile sets the same.
[[build.step]]
run = """
set -eu
bi=github.com/y3owk1n/neru/internal/buildinfo
go build -mod=vendor -trimpath -ldflags="-s -w -X $bi.Version={{tag}} -X $bi.GitCommit=$(git rev-parse --short HEAD) -X $bi.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o neru ./cmd/neru
mkdir -p man
go run -mod=vendor -ldflags="-X $bi.Version={{tag}}" ./cmd/genman man
"""
shell = "sh"
env = { CGO_ENABLED = "1", GOFLAGS = "-buildvcs=false", CGO_CFLAGS_ALLOW = "-fno-strict-overflow" }
when = [{ os = "darwin" }, { os = "linux" }]

# The .syso files carry the icon and the manifest that makes neru per-monitor
# DPI aware, as `just build-windows` generates them. PowerShell 5.1 does not
# stop on a failed native command, so each one checks its exit code.
[[build.step]]
run = """
$ErrorActionPreference = 'Stop'
function Check { if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
Push-Location cmd/neru
go run -mod=vendor github.com/tc-hib/go-winres simply --icon ../../assets/neru-appicon.png --manifest gui --arch {{arch}} --file-description "Neru keyboard-driven navigation tool" --product-name Neru --original-filename neru.exe; Check
Pop-Location
$bi = 'github.com/y3owk1n/neru/internal/buildinfo'
$commit = git rev-parse --short HEAD; Check
$date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
go build -mod=vendor -trimpath "-ldflags=-s -w -X $bi.Version={{tag}} -X $bi.GitCommit=$commit -X $bi.BuildDate=$date" -o neru.exe ./cmd/neru; Check
New-Item -ItemType Directory -Force man | Out-Null
go run -mod=vendor "-ldflags=-X $bi.Version={{tag}}" ./cmd/genman man; Check
"""
shell = "pwsh"
env = { CGO_ENABLED = "0", GOFLAGS = "-buildvcs=false" }
when = { os = "windows" }

# Assembles the bundle as scripts/dist.sh does and signs it ad hoc.
[[build.step]]
run = """
set -eu
app=Neru.app
mkdir -p $app/Contents/MacOS $app/Contents/Resources
cp neru $app/Contents/MacOS/neru
cp resources/icon.icns resources/Neru.entitlements $app/Contents/Resources/
sed -e 's/BUNDLE_VERSION/{{version}}/g' -e 's/SHORT_VERSION/{{version}}/g' -e 's/BUILD_ID/{{tag}}/g' resources/Info.plist.template > $app/Contents/Info.plist
codesign --force --deep --sign - --entitlements resources/Neru.entitlements --options runtime $app
"""
shell = "sh"
when = { os = "darwin" }

[[build.step]]
install = { man = ["man/*.1"], completions = { generate = "./neru completion {{shell}}", name = "neru" } }
when = [{ os = "darwin" }, { os = "linux" }]

# oku runs generate through cmd on Windows, which reads ./neru as a switch.
# cmd looks in the working directory first, so the bare name finds neru.exe.
[[build.step]]
install = { man = ["man/*.1"], completions = { generate = "neru.exe completion {{shell}}", name = "neru" } }
when = { os = "windows" }

[[build.step]]
install = { bin = ["Neru.app/Contents/MacOS/neru"], app = ["Neru.app"] }
when = { os = "darwin" }

[[build.step]]
install = { bin = ["neru"] }
when = { os = "linux" }

[[build.step]]
install = { bin = ["neru.exe"] }
when = { os = "windows" }

# Replaces `neru services install`, so use one of them. Linux has none,
# because the daemon needs the graphical session, and the unit
# `neru services install` writes waits for graphical-session.target.
[[service]]
name = "neru"
command = "bin/neru"
args = ["launch"]
restart = "always"
when = { os = "darwin" }

[[service]]
name = "neru"
command = "bin/neru.exe"
args = ["launch"]
restart = "always"
when = { os = "windows" }

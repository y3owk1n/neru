<!doctype html>
<!-- The social preview card. Regenerate public/og.png with a 1200x630 browser
     screenshot, run from website/, for example with headless Firefox:
     firefox --headless --window-size=1200,630 --screenshot public/og.png file://$PWD/scripts/og-card.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 96px 64px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
        color: #e8eeff;
        background:
          radial-gradient(900px 560px at 8% -12%, rgb(42 56 132 / 0.95), transparent 70%),
          radial-gradient(760px 480px at 100% 110%, rgb(32 30 96 / 0.7), transparent 70%),
          #060b1f;
        -webkit-font-smoothing: antialiased;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .brand img {
        width: 112px;
        height: 112px;
        border-radius: 26px;
      }
      .brand span {
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -0.035em;
      }
      h1 {
        margin: 44px 0 0;
        font-size: 64px;
        line-height: 1.05;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #8fa2f0;
      }
      p {
        margin: 18px 0 0;
        font-size: 30px;
        color: #9aa5c9;
      }
      /* The bottom row lists the platforms Neru runs on and links its source. */
      .foot {
        position: absolute;
        left: 96px;
        right: 96px;
        bottom: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .chips {
        display: flex;
        gap: 12px;
      }
      .chips span {
        padding: 8px 20px;
        border: 1.5px solid rgb(110 130 214 / 0.5);
        border-radius: 999px;
        background: rgb(20 30 70 / 0.55);
        font-size: 22px;
        font-weight: 600;
      }
      .repo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 600;
        color: #c6d0f0;
      }
      .repo svg {
        width: 30px;
        height: 30px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../src/assets/neru-appicon.png" alt="" />
      <span>Neru</span>
    </div>
    <h1>The mouse is now optional.</h1>
    <p>Hints, grids and vim keys for your whole desktop.</p>

    <div class="foot">
      <div class="chips">
        <span>macOS</span>
        <span>Linux</span>
        <span>Windows</span>
        <span>Free and open source</span>
      </div>
      <div class="repo">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        github.com/y3owk1n/neru
      </div>
    </div>
  </body>
</html>

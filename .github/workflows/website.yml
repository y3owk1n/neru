on:
    pull_request:
        paths:
            - "docs/**"
            - "website/**"
            - ".github/workflows/website.yml"
    # Nightly follows main. A release moves the latest channel to the new tag.
    push:
        branches: ["main"]
        paths:
            - "docs/**"
            - "website/**"
            - ".github/workflows/website.yml"
    release:
        types: [published]
    workflow_dispatch:
name: Website
permissions:
    contents: read
# Each deploy replaces the whole site, so pushes to main and releases wait in
# one queue and the newest run deploys last. Each pull request builds in its
# own group, where a newer push cancels the older build.
concurrency:
    group: ${{ github.event_name == 'pull_request' && format('website-pr-{0}', github.ref) || 'website-deploy' }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    build:
        runs-on: ubuntu-latest
        env:
            ASTRO_TELEMETRY_DISABLED: "1"
            NERU_SITE: https://y3owk1n.github.io
            NERU_BASE: /neru/
        steps:
            # The latest channel builds the newest v* tag's docs/, so the
            # checkout needs every tag. Nightly is the checkout, which a
            # release event would otherwise set to the tag instead of main.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'release' && 'main' || '' }}

            # Node comes from website/oku.toml, apart from the Go toolchain.
            - name: Setup Node
              uses: y3owk1n/oku@v0.9.0
              with:
                  path: website
              env:
                  GITHUB_TOKEN: ${{ github.token }}

            - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
              with:
                  just-version: "1.54.0"

            - name: Install dependencies
              run: just website-install

            - name: Type-check
              run: just website-check

            - name: Build latest and nightly
              run: just website-build

            - name: Upload the site
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist/site

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

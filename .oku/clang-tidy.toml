[package]
name = "clang-tidy"
description = "Linter and static analyzer for C, C++ and Objective-C"
homepage = "https://clang.llvm.org/extra/clang-tidy/"
license = "Apache-2.0 WITH LLVM-exception"

# The PyPI wheel, as in clang-format.toml. It ships lib/clang next to the
# binary, which clang-tidy needs for its builtin headers. 21.1.6 is the newest
# 21.1 wheel. New urls and sha256 values: https://pypi.org/pypi/clang-tidy/json.
[version]
value = "21.1.6"


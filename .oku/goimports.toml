[package]
name = "goimports"
description = "Updates Go import lines, from golang.org/x/tools"
homepage = "https://pkg.go.dev/golang.org/x/tools/cmd/goimports"
license = "BSD-3-Clause"

[version]
from = "git-tags"
repo = "https://github.com/golang/tools"
strip_prefix = "v"

[build]
needs = ["git"]
deps = [{ ref = "./go.toml", version = "1.26.6" }]
source = { git = "https://github.com/golang/tools", tag = "{{tag}}" }

[[build.step]]
vendor = "go"

[[build.step]]
run = "go build -mod=vendor -o goimports ./cmd/goimports"
shell = "sh"
env = { GOTOOLCHAIN = "local", GOFLAGS = "-buildvcs=false" }

[[build.step]]
install = { bin = ["goimports"] }

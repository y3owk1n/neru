[package]
name = "clang-format"
description = "Formats C, C++ and Objective-C sources"
homepage = "https://clang.llvm.org/docs/ClangFormat.html"
license = "Apache-2.0 WITH LLVM-exception"

# The PyPI wheel holds a static clang-format and is a zip. The official LLVM
# archive is 1.5 GB. A wheel's URL holds a hash of the file, so each version
# needs new urls and sha256 values from https://pypi.org/pypi/clang-format/json.
[version]
value = "23.1.5"

